when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  publish-luarocks:
    image: nixos/nix:2.35.2
    commands:
      - nix --extra-experimental-features "nix-command flakes" develop --command lx upload --sign-protocol none
    environment:
      LUX_API_KEY:
        from_secret: LUAROCKS_API_KEY
